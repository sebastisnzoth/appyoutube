<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NicheRadar — Confidence Radar</title><style>:root{--bg:#080c18;--p:#11182e;--p2:#17213d;--l:#273657;--t:#f5f7ff;--m:#98a5c6;--a:#7658ff;--g:#22d3a6;--w:#f3b45b;--r:#ff7080}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:radial-gradient(circle at 90% 0,rgba(118,88,255,.22),transparent 30%),var(--bg);color:var(--t)}.wrap{max-width:1380px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.logo{font-size:25px;font-weight:900}.logo i{font-style:normal;color:var(--g)}.status,.pill,.confidence{background:var(--p2);padding:6px 9px;border-radius:999px;font-size:11px}h1{font-size:38px;margin:30px 0 8px}.sub,.note{color:var(--m);line-height:1.55}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px;margin:16px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.field{background:#0c1327;color:white;border:1px solid var(--l);border-radius:11px;padding:12px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;background:var(--g);color:#05241c;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.channel,.niche{background:#0f162c;border:1px solid var(--l);border-radius:15px;padding:15px}.head{display:flex;gap:10px;align-items:center}.head img{width:46px;height:46px;border-radius:50%;object-fit:cover}.head h3{margin:0}.score{margin-left:auto;font-size:28px;font-weight:900;color:var(--g)}.metrics,.components,.timeline{display:grid;gap:7px;margin-top:12px}.metrics{grid-template-columns:repeat(4,1fr)}.components{grid-template-columns:repeat(5,1fr)}.timeline{grid-template-columns:repeat(3,1fr)}.m,.comp,.tw{background:var(--p2);padding:9px;border-radius:10px}.m b,.comp b,.tw b{display:block}.m span,.comp span,.tw span{font-size:9px;color:var(--m)}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.conf-high{color:var(--g)}.conf-mid{color:var(--w)}.conf-low{color:var(--r)}.trend{font-weight:800}.evidence{font-size:11px;padding:8px 0;border-bottom:1px solid rgba(39,54,87,.55)}.hidden{display:none}.history{display:flex;gap:8px;flex-wrap:wrap}.run{background:var(--p2);padding:8px;border-radius:8px;font-size:10px;color:var(--m)}@media(max-width:950px){.grid{grid-template-columns:1fr}.metrics,.components{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div class="logo">Niche<i>Radar</i> <small>MVP</small></div><div id="status" class="status">API…</div></div><h1>Descubre oportunidades con evidencia</h1><p class="sub">Growth Opportunity Score + Timeline + Confidence Score. El score mide potencial; Confidence mide cuán sólida es la evidencia.</p><div class="card"><div class="toolbar"><select id="region" class="field"><option value="US">Estados Unidos</option><option value="ES">España</option><option value="MX">México</option><option value="AR">Argentina</option><option value="BR">Brasil</option></select><select id="mode" class="field"><option value="light">Light</option><option value="balanced" selected>Balanced</option><option value="deep">Deep</option></select><select id="categories" class="field"><option value="6">6 categorías</option><option value="8" selected>8 categorías</option><option value="12">12 categorías</option></select><select id="channelsLimit" class="field"><option value="10">10 canales</option><option value="20" selected>20 canales</option><option value="30">30 canales</option></select><button id="scanBtn" onclick="scanGlobal()">Escanear oportunidades</button></div><div id="error" style="color:#ff9cab;margin-top:8px"></div></div><div id="results" class="hidden"><div class="card"><h2>Canales emergentes</h2><div id="channels" class="grid"></div></div><div class="card"><h2>Micro-nichos detectados</h2><div id="niches" class="grid"></div></div></div><div class="card"><h2>Historial del radar</h2><div id="history" class="history"></div></div></div><script>const fmt=n=>Intl.NumberFormat('es',{notation:'compact',maximumFractionDigits:1}).format(n||0);async function api(u,o={}){const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}async function loadStatus(){const s=await api('/api/status'),e=document.getElementById('status');e.textContent=s.youtube_api_configured?'● YouTube API conectada':'● Falta YOUTUBE_API_KEY';e.style.color=s.youtube_api_configured?'#22d3a6':'#f3b45b'}function confClass(l){return l==='Alta'?'conf-high':l==='Media'?'conf-mid':'conf-low'}function win(label,w){return !w||!w.available?`<div class="tw"><b>—</b><span>${label} · sin historial</span></div>`:`<div class="tw"><b>+${fmt(w.views_delta)}</b><span>${label} · ${fmt(w.views_per_day)} views/día</span></div>`}async function scanGlobal(){const b=scanBtn;b.disabled=true;b.textContent='Escaneando…';error.textContent='';try{const d=await api('/api/discovery/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region:region.value,discovery_mode:mode.value,category_limit:+categories.value,channels_limit:+channelsLimit.value})});render(d);loadHistory()}catch(e){error.textContent=e.message}finally{b.disabled=false;b.textContent='Escanear oportunidades'}}function render(d){const cs=d.channels||[],ns=d.niches||[];channels.innerHTML=cs.map((c,i)=>{const cp=c.components||{},cf=c.confidence||{},tl=c.timeline||{},ws=tl.windows||{},tr=tl.trend||{};return `<div class="channel"><div class="head"><img src="${c.thumbnail||''}"><div><div class="note">#${i+1} · ${esc(c.category_hint||'Sin categoría')}</div><h3>${esc(c.title)}</h3></div><div class="score">${c.channel_score}</div></div><div class="badges"><span class="confidence ${confClass(cf.label)}">Confidence ${cf.label||'—'} · ${cf.score??'—'}</span><span class="pill">${esc(tr.status||'Recolectando datos')}</span></div><div class="metrics"><div class="m"><b>${fmt(c.subscribers)}</b><span>Subs</span></div><div class="m"><b>${fmt(c.median_views_per_day)}</b><span>Mediana views/día</span></div><div class="m"><b>${c.outliers_2x}</b><span>Outliers 2x+</span></div><div class="m"><b>${c.uploads_30d}</b><span>Uploads 30d</span></div></div><div class="components"><div class="comp"><b>${cp.momentum??'—'}</b><span>Momentum</span></div><div class="comp"><b>${cp.outliers??'—'}</b><span>Outliers</span></div><div class="comp"><b>${cp.audience_efficiency??'—'}</b><span>Audience Eff.</span></div><div class="comp"><b>${cp.freshness??'—'}</b><span>Freshness</span></div><div class="comp"><b>${cp.consistency??'—'}</b><span>Consistency</span></div></div><div class="timeline">${win('24h',ws['24h'])}${win('7d',ws['7d'])}${win('30d',ws['30d'])}</div></div>`}).join('')||'<div class="note">Sin canales.</div>';niches.innerHTML=ns.map((n,i)=>`<div class="niche"><div class="head"><div><div class="note">Oportunidad #${i+1}</div><h3>${esc(n.name)}</h3></div><div class="score">${n.opportunity_score}</div></div><div class="badges"><span class="confidence ${confClass(n.confidence?.label)}">Confidence ${n.confidence?.label||'—'} · ${n.confidence?.score??'—'}</span><span class="pill">${n.channel_count} canales</span><span class="pill">${n.signal_video_count} señales</span></div><h4>Evidencia</h4>${(n.evidence||[]).slice(0,3).map(e=>`<div class="evidence"><b>${esc(e.title)}</b><br><span class="note">${esc(e.channel)} · ${e.outlier_score}x · ${fmt(e.views_per_day)} views/día</span></div>`).join('')}</div>`).join('')||'<div class="note">Sin micro-nichos suficientes.</div>';results.classList.remove('hidden')}async function loadHistory(){try{const r=await api('/api/discovery/history?limit=10');history.innerHTML=r.map(x=>`<div class="run">#${x.id} · ${esc(x.region)} · ${esc(x.discovery_mode)} · ${x.channels_scanned} canales</div>`).join('')||'<span class="note">Sin historial.</span>'}catch(e){history.innerHTML='<span class="note">No se pudo cargar.</span>'}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}loadStatus().catch(()=>{});loadHistory();</script></body></html>
